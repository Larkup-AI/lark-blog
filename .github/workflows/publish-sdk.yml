name: Publish Larkup-Blog SDK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"
          scope: "@larkup"

      - name: Install dependencies
        working-directory: packages/blog-sdk
        run: npm ci

      - name: Build SDK
        working-directory: packages/blog-sdk
        run: npm run build

      - name: Publish to npm
        working-directory: packages/blog-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
