# Local self-host stack: app + Postgres + MinIO (S3-compatible storage).
# Usage:  cp .env.example .env  &&  docker compose up -d
services:
  studio:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lark:lark@db:5432/lark
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-dev-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-dev-secret}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEPLOYMENT_MODE: selfhost
      # Storage via MinIO (S3-compatible)
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-lark-media}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/${S3_BUCKET:-lark-media}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lark
      POSTGRES_PASSWORD: lark
      POSTGRES_DB: lark
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lark"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
